name: checkout-siblings
description: >-
  Check out freemkv sibling repos at the branch-matched ref and (optionally)
  write a [patch.crates-io] config so the workspace resolves against the tips
  under test. Replaces the per-job sibling-checkout + heredoc block that was
  copy-pasted across every repo. The caller checks ITSELF out first (into
  `self`); this action adds the siblings alongside it.
inputs:
  checkout:
    description: Space-separated sibling repo names to clone as siblings (dependency order).
    required: true
  patch:
    description: >-
      Space-separated crate names to write into the caller's [patch.crates-io]
      (path = ../<name>). Empty = write no config (base repos resolve their one
      path-dep by layout alone).
    required: false
    default: ""
  self:
    description: The caller repo's checkout dir name (where .cargo/config.toml is written). Required when `patch` is set.
    required: false
    default: ""
  ref:
    description: >-
      Sibling ref override. Default resolves from the caller's branch:
      qa->qa, main->main, everything else (incl. dev)->dev. This 3-way match
      is what keeps a main build validating against sibling MAIN, not dev.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IN_CHECKOUT: ${{ inputs.checkout }}
        IN_PATCH: ${{ inputs.patch }}
        IN_SELF: ${{ inputs.self }}
        IN_REF: ${{ inputs.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        ref="$IN_REF"
        if [ -z "$ref" ]; then
          case "$REF_NAME" in
            qa) ref=qa ;;
            main) ref=main ;;
            *) ref=dev ;;
          esac
        fi
        echo "checkout-siblings: ref=$ref repos='$IN_CHECKOUT'"
        for r in $IN_CHECKOUT; do
          if [ -e "$r" ]; then echo "  $r already present, skipping"; continue; fi
          git clone --depth 1 --branch "$ref" "https://github.com/freemkv/$r" "$r"
        done
        if [ -n "$IN_PATCH" ]; then
          if [ -z "$IN_SELF" ]; then echo "::error::checkout-siblings: 'self' is required when 'patch' is set"; exit 1; fi
          mkdir -p "$IN_SELF/.cargo"
          {
            echo '[patch.crates-io]'
            for c in $IN_PATCH; do echo "$c = { path = \"../$c\" }"; done
          } > "$IN_SELF/.cargo/config.toml"
          echo "checkout-siblings: wrote $IN_SELF/.cargo/config.toml"
          cat "$IN_SELF/.cargo/config.toml"
        fi
