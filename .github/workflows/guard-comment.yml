name: guard-comment

# Shared checks for concise comments and no root docs/ overflow.

on:
  workflow_call:

jobs:
  comment-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: freemkv/.github
          ref: v2
          path: .guard
      - name: Test comment guard
        run: python3 .guard/ci/comment-guard.py --selftest
      - name: Run comment-guard
        run: python3 .guard/ci/comment-guard.py
