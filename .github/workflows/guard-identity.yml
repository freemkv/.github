name: guard-identity

# Reusable identity gate: no commit may carry an unrelated-business or
# non-canonical author/committer email. Self-contained (no external script).
# Callers: `uses: freemkv/.github/.github/workflows/guard-identity.yml@v1`.

on:
  workflow_call:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject banned author/committer emails
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # sha256 of banned "@domain"s and full addresses, never the plain text:
          # this file is public. Real external contributors are unaffected.
          BANNED_SHA="553fff72ac907c1a6d4e9034f115221ecf0b05cf45ee5b757caa7541573668f8 a02674d1cb6f293e6886a609d463e8c1747a545e52def67dbdf52b214c8f74f0 7299f3b8dac44ef6412eff29a0f36866f1470d446551e421aa74967171d1296e"
          h() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          bad=""
          while read -r sha email; do
            e=$(printf '%s' "$email" | tr 'A-Z' 'a-z')
            for x in "$(h "$e")" "$(h "@${e#*@}")"; do
              case " $BANNED_SHA " in *" $x "*) bad="$bad $sha";; esac
            done
          done < <(git log --format='%h %ae%n%h %ce' "$range" 2>/dev/null | sort -u)
          if [ -n "$bad" ]; then
            echo "::error::commit(s) carry a banned author/committer identity:$(printf '%s\n' $bad | sort -u | tr '\n' ' ')"
            echo "::error::Commit as your GitHub noreply (1085847+MattJackson@users.noreply.github.com). Fix: git config user.email <noreply>; git commit --amend --reset-author."
            exit 1
          fi
          echo "identity-guard: clean"
